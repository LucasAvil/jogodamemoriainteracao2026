+=<!doctype html>
<html lang="en">
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="start-screen" class="start-screen">
      <h1>Jogo da Memória</h1>
      <p>Ciência da Computação — UPF</p>

      <button id="start-btn">JOGAR</button>
    </div>

    <div id="game-container" class="game-container hidden">
      <header class="dashboard">
        <div class="theme-info">
          <span>Tema:</span>
          <h2 id="theme">Computação</h2>
        </div>

        <div class="stats">
          <div class="stat-box">Tempo: <span id="timer">00:00</span></div>
          <div class="stat-box">Acertos: <span id="hits">0</span></div>
          <div class="stat-box">Erros: <span id="errors">0</span></div>
        </div>

        <button id="reset-btn">Reiniciar</button>
      </header>

      <main class="card-grid"></main>
    </div>

    <div id="result-screen" class="result-screen hidden">
      <div class="result-card">
        <h2 id="result-title">Fim de Jogo!</h2>
        <p id="result-message">O tempo acabou.</p>
        <button id="retry-btn">Tentar Novamente</button>
      </div>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
