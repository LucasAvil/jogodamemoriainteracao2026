<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <div class="game-container">
    <header class="dashboard">
      <div class="theme-info">
        <span>Tema:</span>
        <h2 id="theme">Placeholder</h2>
      </div>

      <div class="stats">
        <div class="stat-box">Tempo: <span id="timer">00:00</span></div>
        <div class="stat-box">Acertos: <span id="hits">0</span></div>
        <div class="stat-box">Erros: <span id="errors">0</span></div>
      </div>

      <button id="reset-btn">Reiniciar</button>
    </header>

    <main class="card-grid">
      <div class="card" data-card="1"></div>
      <div class="card" data-card="2"></div>
      <div class="card" data-card="3"></div>
      <div class="card" data-card="4"></div>
      <div class="card" data-card="5"></div>
      <div class="card" data-card="6"></div>
      <div class="card" data-card="7"></div>
      <div class="card" data-card="8"></div>
      <div class="card" data-card="9"></div>
      <div class="card" data-card="10"></div>
      <div class="card" data-card="11"></div>
      <div class="card" data-card="12"></div>
      <div class="card" data-card="13"></div>
      <div class="card" data-card="14"></div>
      <div class="card" data-card="15"></div>
      <div class="card" data-card="16"></div>
    </main>
  </div>
</html>
